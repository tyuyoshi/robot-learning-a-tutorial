[project]
name = "so101-learning-environment"
version = "0.1.0"
description = "Isolated LeRobot environment for SO-101 hardware practice"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lerobot[dataset,feetech,training]==0.6.1",
    "pyzmq==27.1.0",
]

[tool.uv]
package = false
# eMudhra/emSign CA 証明書インシデント対応（certifi 2026.10.23 で該当 CA を削除）
constraint-dependencies = ["certifi>=2026.10.23"]
# uv 0.13.4 以前は自前の CA リストに侵害された emSign 系ルートを含むため、0.13.5 以上を必須にする
required-version = ">=0.13.5"
